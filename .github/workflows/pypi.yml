name: Publish busymeter to PyPI

# Started by hand (Actions > Publish busymeter to PyPI > Run workflow). PyPI Trusted Publishing: the workflow trades
# GitHub's OIDC token for a short-lived upload token, so no API token is stored anywhere. Tests and build run on
# Windows (the package's sign-in start is Windows only); the upload action needs Linux.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest

      - name: Build
        run: |
          python -m pip install build==1.3.0
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
